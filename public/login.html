<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clínica - Iniciar sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container" style="max-width: 420px;">
    <div class="text-center mt-5 mb-4">
      <h3 class="text-primary">Expedientes clínicos</h3>
      <p class="text-muted">Inicia sesión como médico o paciente</p>
    </div>
    <div class="card shadow-sm">
      <div class="card-body">
        <form id="formLogin">
          <div class="mb-3">
            <label class="form-label">Correo</label>
            <input id="correo" type="email" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input id="password" type="password" class="form-control" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Entrar</button>
          <div id="mensaje" class="mt-3"></div>
        </form>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('formLogin').addEventListener('submit', async e => {
      e.preventDefault();
      const mensaje = document.getElementById('mensaje');
      mensaje.innerHTML = '';
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          correo: document.getElementById('correo').value,
          password: document.getElementById('password').value
        })
      });
      const datos = await res.json();
      if (!res.ok) {
        const d = document.createElement('div');
        d.className = 'alert alert-danger py-2';
        d.textContent = datos.error || 'Error al iniciar sesión';
        mensaje.appendChild(d);
        return;
      }
      location.href = datos.rol === 'medico'
        ? 'index.html'
        : 'expediente.html?id=' + datos.paciente_id;
    });
  </script>
</body>
</html>
