<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clínica - Pacientes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Expedientes clínicos</span>
      <span class="text-white">
        <span id="nombreMedico" class="me-2"></span>
        <button id="btnSalir" class="btn btn-sm btn-outline-light">Salir</button>
      </span>
    </div>
  </nav>

  <div class="container">
    <div id="mensaje"></div>
    <div id="acceso"></div>
    <div class="row">
      <div class="col-lg-4 mb-4">
        <div class="card shadow-sm">
          <div class="card-header" id="tituloForm">Nuevo paciente</div>
          <div class="card-body">
            <div class="mb-2">
              <label class="form-label">Nombre *</label>
              <input id="nombre" class="form-control">
            </div>
            <div class="mb-2">
              <label class="form-label">Fecha de nacimiento *</label>
              <input id="fecha_nacimiento" type="date" class="form-control">
            </div>
            <div class="mb-2">
              <label class="form-label">Sexo</label>
              <select id="sexo" class="form-select">
                <option value="F">F</option>
                <option value="M">M</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Teléfono</label>
              <input id="telefono" class="form-control">
            </div>
            <button id="btnGuardar" class="btn btn-primary w-100">Guardar paciente</button>
            <button id="btnCancelar" class="btn btn-outline-secondary w-100 mt-2 d-none">Cancelar edición</button>
          </div>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="card shadow-sm">
          <div class="card-header d-flex justify-content-between align-items-center gap-2">
            <span>Mis pacientes <span id="contador" class="badge bg-secondary"></span></span>
            <input id="buscar" class="form-control form-control-sm w-50" placeholder="Buscar por nombre o teléfono...">
          </div>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead>
                <tr><th>ID</th><th>Nombre</th><th>Edad</th><th>Sexo</th><th>Teléfono</th><th></th></tr>
              </thead>
              <tbody id="tabla"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let pacientes = [];
    let editandoId = null;

    const $ = id => document.getElementById(id);

    function esc(valor) {
      const d = document.createElement('div');
      d.textContent = valor ?? '';
      return d.innerHTML;
    }

    // Todas las llamadas pasan por aquí: si la sesión venció, manda al login
    async function api(url, opciones) {
      const res = await fetch(url, opciones);
      if (res.status === 401) {
        location.href = 'login.html';
        throw new Error('Sin sesión');
      }
      return res;
    }

    function edad(fecha) {
      if (!fecha) return '';
      const hoy = new Date();
      const n = new Date(fecha + 'T00:00:00');
      let e = hoy.getFullYear() - n.getFullYear();
      const m = hoy.getMonth() - n.getMonth();
      if (m < 0 || (m === 0 && hoy.getDate() < n.getDate())) e--;
      return e;
    }

    function aviso(tipo, texto) {
      $('mensaje').innerHTML = `<div class="alert alert-${tipo} py-2">${esc(texto)}</div>`;
      setTimeout(() => $('mensaje').innerHTML = '', 4000);
    }

    async function iniciar() {
      const res = await api('/auth/yo');
      const yo = await res.json();
      if (yo.rol !== 'medico') {
        location.href = 'expediente.html?id=' + yo.paciente_id;
        return;
      }
      $('nombreMedico').textContent = yo.nombre;
      cargarPacientes();
    }

    async function cargarPacientes() {
      const res = await api('/pacientes');
      pacientes = await res.json();
      mostrar();
    }

    function mostrar() {
      const q = $('buscar').value.trim().toLowerCase();
      const filtrados = pacientes.filter(p =>
        (p.nombre || '').toLowerCase().includes(q) || (p.telefono || '').includes(q));
      $('contador').textContent = filtrados.length;
      $('tabla').innerHTML = filtrados.length === 0
        ? '<tr><td colspan="6" class="text-center text-muted py-3">Sin resultados</td></tr>'
        : filtrados.map(p => `
          <tr>
            <td>${p.id}</td>
            <td>${esc(p.nombre)}</td>
            <td>${edad(p.fecha_nacimiento)}</td>
            <td>${esc(p.sexo)}</td>
            <td>${esc(p.telefono)}</td>
            <td class="text-end text-nowrap">
              <a class="btn btn-sm btn-outline-primary" href="expediente.html?id=${p.id}">Expediente</a>
              <button class="btn btn-sm btn-outline-secondary" data-accion="editar" data-id="${p.id}">Editar</button>
              <button class="btn btn-sm btn-outline-danger" data-accion="borrar" data-id="${p.id}">Eliminar</button>
            </td>
          </tr>`).join('');
    }

    function limpiarForm() {
      editandoId = null;
      ['nombre', 'fecha_nacimiento', 'telefono'].forEach(c => $(c).value = '');
      $('sexo').value = 'F';
      $('tituloForm').textContent = 'Nuevo paciente';
      $('btnGuardar').textContent = 'Guardar paciente';
      $('btnCancelar').classList.add('d-none');
    }

    function editar(id) {
      const p = pacientes.find(x => x.id === id);
      if (!p) return;
      editandoId = id;
      $('nombre').value = p.nombre || '';
      $('fecha_nacimiento').value = p.fecha_nacimiento || '';
      $('sexo').value = p.sexo || 'F';
      $('telefono').value = p.telefono || '';
      $('tituloForm').textContent = 'Editando paciente #' + id;
      $('btnGuardar').textContent = 'Actualizar paciente';
      $('btnCancelar').classList.remove('d-none');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function borrar(id) {
      const p = pacientes.find(x => x.id === id);
      if (!confirm(`¿Eliminar a "${p.nombre}"?\n\nTambién se borrarán sus notas clínicas y su acceso. Esta acción no se puede deshacer.`)) return;
      const res = await api('/pacientes/' + id, { method: 'DELETE' });
      const datos = await res.json();
      if (!res.ok) return aviso('danger', datos.error || 'Error al eliminar');
      if (datos.aviso) aviso('warning', datos.aviso);
      else aviso('success', `Paciente eliminado (${datos.notasBorradas} notas borradas)`);
      if (editandoId === id) limpiarForm();
      cargarPacientes();
    }

    function mostrarAcceso(acceso) {
      $('acceso').innerHTML = `
        <div class="alert alert-info alert-dismissible">
          <strong>Acceso del paciente.</strong> Entrégale estos datos, la contraseña solo se muestra ahora:<br>
          Correo: <code>${esc(acceso.correo)}</code> &nbsp; Contraseña: <code>${esc(acceso.password)}</code>
          <button type="button" class="btn-close" data-bs-dismiss="alert" onclick="this.parentElement.remove()"></button>
        </div>`;
    }

    async function guardar() {
      const datos = {
        nombre: $('nombre').value.trim(),
        fecha_nacimiento: $('fecha_nacimiento').value,
        sexo: $('sexo').value,
        telefono: $('telefono').value.trim()
      };
      if (!datos.nombre || !datos.fecha_nacimiento) {
        return aviso('warning', 'Nombre y fecha de nacimiento son obligatorios');
      }
      const eraEdicion = !!editandoId;
      const res = await api(eraEdicion ? '/pacientes/' + editandoId : '/pacientes', {
        method: eraEdicion ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(datos)
      });
      const respuesta = await res.json();
      if (!res.ok) return aviso('danger', respuesta.error || 'Error al guardar');
      aviso('success', eraEdicion ? 'Paciente actualizado' : 'Paciente guardado');
      if (!eraEdicion && respuesta.acceso) mostrarAcceso(respuesta.acceso);
      limpiarForm();
      cargarPacientes();
    }

    $('btnGuardar').addEventListener('click', guardar);
    $('btnCancelar').addEventListener('click', limpiarForm);
    $('buscar').addEventListener('input', mostrar);
    $('btnSalir').addEventListener('click', async () => {
      await fetch('/auth/logout', { method: 'POST' });
      location.href = 'login.html';
    });
    $('tabla').addEventListener('click', e => {
      const btn = e.target.closest('button[data-accion]');
      if (!btn) return;
      const id = Number(btn.dataset.id);
      if (btn.dataset.accion === 'editar') editar(id);
      if (btn.dataset.accion === 'borrar') borrar(id);
    });

    iniciar();
  </script>
</body>
</html>
