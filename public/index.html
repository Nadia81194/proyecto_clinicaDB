<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clínica - Pacientes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Expedientes clínicos</span>
    </div>
  </nav>

  <div class="container">
    <div class="row">
      <!-- Formulario de alta -->
      <div class="col-md-4 mb-4">
        <div class="card shadow-sm">
          <div class="card-header">Nuevo paciente</div>
          <div class="card-body">
            <div class="mb-2">
              <label class="form-label">Nombre</label>
              <input id="nombre" class="form-control">
            </div>
            <div class="mb-2">
              <label class="form-label">Fecha de nacimiento</label>
              <input id="fecha_nacimiento" type="date" class="form-control">
            </div>
            <div class="mb-2">
              <label class="form-label">Sexo</label>
              <select id="sexo" class="form-select">
                <option value="F">F</option>
                <option value="M">M</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Teléfono</label>
              <input id="telefono" class="form-control">
            </div>
            <button class="btn btn-primary w-100" onclick="crearPaciente()">Guardar paciente</button>
            <div id="mensaje" class="mt-2"></div>
          </div>
        </div>
      </div>

      <!-- Lista de pacientes -->
      <div class="col-md-8">
        <div class="card shadow-sm">
          <div class="card-header">Pacientes</div>
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead>
                <tr><th>ID</th><th>Nombre</th><th>Sexo</th><th>Teléfono</th><th></th></tr>
              </thead>
              <tbody id="tabla"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function cargarPacientes() {
      const res = await fetch('/pacientes');
      const pacientes = await res.json();
      const tabla = document.getElementById('tabla');
      tabla.innerHTML = '';
      pacientes.forEach(p => {
        const fila = document.createElement('tr');
        fila.innerHTML = `
          <td>${p.id}</td>
          <td></td>
          <td>${p.sexo ?? ''}</td>
          <td></td>
          <td><a class="btn btn-sm btn-outline-primary" href="expediente.html?id=${p.id}">Ver expediente</a></td>`;
        fila.children[1].textContent = p.nombre;
        fila.children[3].textContent = p.telefono ?? '';
        tabla.appendChild(fila);
      });
    }

    async function crearPaciente() {
      const datos = {
        nombre: document.getElementById('nombre').value,
        fecha_nacimiento: document.getElementById('fecha_nacimiento').value,
        sexo: document.getElementById('sexo').value,
        telefono: document.getElementById('telefono').value
      };
      const mensaje = document.getElementById('mensaje');
      if (!datos.nombre || !datos.fecha_nacimiento) {
        mensaje.innerHTML = '<div class="alert alert-warning py-1">Nombre y fecha son obligatorios</div>';
        return;
      }
      const res = await fetch('/pacientes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(datos)
      });
      if (res.ok) {
        mensaje.innerHTML = '<div class="alert alert-success py-1">Paciente guardado</div>';
        document.getElementById('nombre').value = '';
        document.getElementById('telefono').value = '';
        cargarPacientes();
      } else {
        mensaje.innerHTML = '<div class="alert alert-danger py-1">Error al guardar</div>';
      }
    }

    cargarPacientes();
  </script>
</body>
</html>
