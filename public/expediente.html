<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SYSMEDIQ - Expediente</title>
  <link rel="icon" href="logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar bg-white border-bottom shadow-sm mb-4">
    <div class="container">
      <a id="enlaceInicio" class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <img src="logo.png" alt="SYSMEDIQ" height="44">
        <img src="nombre.png" alt="SYSMEDIQ" height="26">
      </a>
      <span>
        <a id="volver" href="index.html" class="btn btn-sm btn-outline-primary me-2">← Pacientes</a>
        <span id="nombreUsuario" class="me-2 text-muted"></span>
        <button id="btnSalir" class="btn btn-sm btn-outline-secondary">Salir</button>
      </span>
    </div>
  </nav>

  <div class="container">
    <div id="error"></div>

    <div class="card shadow-sm mb-4">
      <div class="card-header">Datos del paciente <span class="badge bg-secondary">PostgreSQL</span></div>
      <div class="card-body" id="paciente"></div>
    </div>

    <div class="row">
      <div class="col-lg-8 mb-4" id="colNotas">
        <h5>Notas clínicas <span class="badge bg-success">MongoDB</span> <span id="contador" class="badge bg-light text-dark border"></span></h5>
        <div id="notas"></div>
      </div>

      <div class="col-lg-4 mb-4" id="colForm">
        <div class="card shadow-sm">
          <div class="card-header" id="tituloForm">Agregar nota</div>
          <div class="card-body">
            <div class="mb-2">
              <label class="form-label">Especialidad</label>
              <select id="especialidad" class="form-select">
                <option value="">Selecciona una especialidad...</option>
                <option>Medicina general</option>
                <option>Cardiología</option>
                <option>Neurología</option>
                <option>Pediatría</option>
                <option>Ginecología</option>
                <option>Endocrinología</option>
                <option>Traumatología</option>
                <option>Dermatología</option>
                <option>Oftalmología</option>
                <option>Otorrinolaringología</option>
                <option>Psiquiatría</option>
                <option>Gastroenterología</option>
                <option>Neumología</option>
                <option>Urología</option>
                <option>Oncología</option>
                <option>Nutrición</option>
                <option>Odontología</option>
              </select>
            </div>
            <!-- Campos que cambian según la especialidad -->
            <div id="camposExtra"></div>
            <div class="mb-2">
              <label class="form-label">Diagnóstico *</label>
              <input id="diagnostico" class="form-control">
            </div>
            <div class="mb-2">
              <label class="form-label">Síntomas (separados por coma)</label>
              <input id="sintomas" class="form-control">
            </div>
            <div class="mb-2">
              <label class="form-label">Medicamentos</label>
              <div id="listaMeds"></div>
              <button type="button" id="btnAgregarMed" class="btn btn-sm btn-outline-success mt-1">+ Agregar medicamento</button>
            </div>
            <div class="mb-3">
              <label class="form-label">Notas</label>
              <textarea id="texto_libre" class="form-control" rows="3"></textarea>
            </div>
            <button id="btnGuardar" class="btn btn-success w-100">Guardar nota</button>
            <button id="btnCancelar" class="btn btn-outline-secondary w-100 mt-2 d-none">Cancelar edición</button>
            <div id="mensaje" class="mt-2"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const id = new URLSearchParams(location.search).get('id');
    let notas = [];
    let editandoNota = null;
    let yo = null;
    let CAMPOS = {}; // campos extra por especialidad (vienen del servidor)

    const $ = x => document.getElementById(x);
    const CONOCIDOS = ['_id', 'paciente_id', 'fecha', 'especialidad', 'diagnostico', 'sintomas', 'medicamentos', 'texto_libre', 'registrado_por'];

    function esc(valor) {
      const d = document.createElement('div');
      d.textContent = valor ?? '';
      return d.innerHTML;
    }

    async function api(url, opciones) {
      const res = await fetch(url, opciones);
      if (res.status === 401) {
        location.href = 'login.html';
        throw new Error('Sin sesión');
      }
      return res;
    }

    function edad(fecha) {
      if (!fecha) return '';
      const hoy = new Date();
      const n = new Date(fecha + 'T00:00:00');
      let e = hoy.getFullYear() - n.getFullYear();
      const m = hoy.getMonth() - n.getMonth();
      if (m < 0 || (m === 0 && hoy.getDate() < n.getDate())) e--;
      return e + ' años';
    }

    function aviso(tipo, texto) {
      $('mensaje').innerHTML = `<div class="alert alert-${tipo} py-1">${esc(texto)}</div>`;
      setTimeout(() => $('mensaje').innerHTML = '', 4000);
    }

    function etiquetaDe(clave) {
      for (const lista of Object.values(CAMPOS)) {
        const c = lista.find(x => x.clave === clave);
        if (c) return c.etiqueta;
      }
      return clave.replaceAll('_', ' ');
    }

    // ----- Campos extra según la especialidad -----
    function pintarExtras(especialidad, valores = {}) {
      const cont = $('camposExtra');
      cont.innerHTML = '';
      (CAMPOS[especialidad] || []).forEach(c => {
        const div = document.createElement('div');
        div.className = 'mb-2';
        div.innerHTML = '<label class="form-label"></label><input class="form-control">';
        div.querySelector('label').textContent = c.etiqueta;
        const input = div.querySelector('input');
        input.id = 'extra_' + c.clave;
        input.type = c.tipo === 'numero' ? 'number' : 'text';
        if (c.tipo === 'numero') input.step = 'any';
        input.placeholder = c.ejemplo || '';
        input.value = valores[c.clave] ?? '';
        cont.appendChild(div);
      });
    }

    function leerExtras() {
      const salida = {};
      (CAMPOS[$('especialidad').value] || []).forEach(c => {
        salida[c.clave] = $('extra_' + c.clave).value;
      });
      return salida;
    }

    // ----- Medicamentos: filas separadas (nombre, dosis, frecuencia) -----
    function agregarFilaMed(m = {}) {
      const fila = document.createElement('div');
      fila.className = 'border rounded p-2 mb-2 fila-med';
      fila.innerHTML = `
        <div class="d-flex gap-1 mb-1">
          <input class="form-control form-control-sm med-nombre" placeholder="Medicamento">
          <button type="button" class="btn btn-sm btn-outline-danger" title="Quitar">✕</button>
        </div>
        <div class="d-flex gap-1">
          <input class="form-control form-control-sm med-dosis" placeholder="Dosis">
          <input class="form-control form-control-sm med-frecuencia" placeholder="Frecuencia">
        </div>`;
      fila.querySelector('.med-nombre').value = m.nombre || '';
      fila.querySelector('.med-dosis').value = m.dosis || '';
      fila.querySelector('.med-frecuencia').value = m.frecuencia || '';
      fila.querySelector('button').addEventListener('click', () => fila.remove());
      $('listaMeds').appendChild(fila);
    }

    function cargarMeds(meds) {
      $('listaMeds').innerHTML = '';
      (meds || []).forEach(m => agregarFilaMed(m));
      if (!meds || meds.length === 0) agregarFilaMed();
    }

    function leerMeds() {
      return [...document.querySelectorAll('.fila-med')].map(f => ({
        nombre: f.querySelector('.med-nombre').value.trim(),
        dosis: f.querySelector('.med-dosis').value.trim(),
        frecuencia: f.querySelector('.med-frecuencia').value.trim()
      })).filter(m => m.nombre);
    }

    function ponerEspecialidad(valor) {
      const sel = $('especialidad');
      if (valor && ![...sel.options].some(o => o.value === valor || o.text === valor)) {
        sel.add(new Option(valor, valor));
      }
      sel.value = valor || '';
    }

    // ----- Carga del expediente -----
    async function cargarExpediente() {
      const res = await api('/expediente/' + id);
      if (!res.ok) {
        const d = await res.json().catch(() => ({}));
        $('error').innerHTML = `<div class="alert alert-danger">${esc(d.error || 'No se pudo cargar el expediente')}</div>`;
        return;
      }
      const datos = await res.json();
      const p = datos.paciente;
      notas = datos.notas;
      const esMedico = yo.rol === 'medico';

      $('paciente').innerHTML = `
        <div class="row">
          <div class="col-md-3"><strong>Nombre</strong><br>${esc(p.nombre)}</div>
          <div class="col-md-3"><strong>Nacimiento</strong><br>${esc(p.fecha_nacimiento)} (${edad(p.fecha_nacimiento)})</div>
          <div class="col-md-3"><strong>Sexo</strong><br>${esc(p.sexo)}</div>
          <div class="col-md-3"><strong>Teléfono</strong><br>${esc(p.telefono)}</div>
        </div>`;

      $('contador').textContent = notas.length;
      if (notas.length === 0) {
        $('notas').innerHTML = '<div class="alert alert-info">Este paciente aún no tiene notas.</div>';
        return;
      }
      $('notas').innerHTML = notas.map(n => {
        const meds = (n.medicamentos || [])
          .map(m => `${esc(m.nombre)} ${esc(m.dosis)} (${esc(m.frecuencia)})`).join('<br>');
        const sintomas = (n.sintomas || [])
          .map(s => `<span class="badge bg-light text-dark border">${esc(s)}</span>`).join(' ');
        const extras = Object.entries(n).filter(([k]) => !CONOCIDOS.includes(k))
          .map(([k, v]) => `<span class="badge text-bg-secondary me-1">${esc(etiquetaDe(k))}: ${esc(v)}</span>`).join('');
        const botones = esMedico ? `
          <span>
            <button class="btn btn-sm btn-outline-secondary" data-accion="editar" data-id="${n._id}">Editar</button>
            <button class="btn btn-sm btn-outline-danger" data-accion="borrar" data-id="${n._id}">Eliminar</button>
          </span>` : '';
        return `
          <div class="card shadow-sm mb-3">
            <div class="card-header d-flex justify-content-between align-items-center">
              <span>${esc(n.especialidad)} <small class="text-muted ms-2">${esc((n.fecha || '').slice(0, 10))}</small></span>
              ${botones}
            </div>
            <div class="card-body">
              <h6>${esc(n.diagnostico)}</h6>
              <p class="mb-1">${sintomas}</p>
              ${extras ? `<p class="mb-1">${extras}</p>` : ''}
              ${meds ? `<p class="mb-1"><strong>Medicamentos:</strong><br>${meds}</p>` : ''}
              <p class="mb-0 text-muted">${esc(n.texto_libre)}</p>
            </div>
          </div>`;
      }).join('');
    }

    function limpiarForm() {
      editandoNota = null;
      ['especialidad', 'diagnostico', 'sintomas', 'texto_libre'].forEach(c => $(c).value = '');
      pintarExtras('');
      cargarMeds([]);
      $('tituloForm').textContent = 'Agregar nota';
      $('btnGuardar').textContent = 'Guardar nota';
      $('btnCancelar').classList.add('d-none');
    }

    function editar(notaId) {
      const n = notas.find(x => x._id === notaId);
      if (!n) return;
      editandoNota = notaId;
      ponerEspecialidad(n.especialidad);
      pintarExtras(n.especialidad, n);
      $('diagnostico').value = n.diagnostico || '';
      $('sintomas').value = (n.sintomas || []).join(', ');
      cargarMeds(n.medicamentos);
      $('texto_libre').value = n.texto_libre || '';
      $('tituloForm').textContent = 'Editando nota';
      $('btnGuardar').textContent = 'Actualizar nota';
      $('btnCancelar').classList.remove('d-none');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function borrar(notaId) {
      if (!confirm('¿Eliminar esta nota clínica? Esta acción no se puede deshacer.')) return;
      const res = await api('/notas/' + notaId, { method: 'DELETE' });
      if (!res.ok) return aviso('danger', 'Error al eliminar la nota');
      if (editandoNota === notaId) limpiarForm();
      aviso('success', 'Nota eliminada');
      cargarExpediente();
    }

    async function guardar() {
      const diagnostico = $('diagnostico').value.trim();
      if (!diagnostico) return aviso('warning', 'El diagnóstico es obligatorio');
      const nota = {
        especialidad: $('especialidad').value,
        diagnostico,
        sintomas: $('sintomas').value.split(',').map(s => s.trim()).filter(Boolean),
        medicamentos: leerMeds(),
        texto_libre: $('texto_libre').value.trim(),
        ...leerExtras()
      };
      const url = editandoNota ? '/notas/' + editandoNota : `/pacientes/${id}/notas`;
      const res = await api(url, {
        method: editandoNota ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(nota)
      });
      if (!res.ok) {
        const d = await res.json().catch(() => ({}));
        return aviso('danger', d.error || 'Error al guardar la nota');
      }
      const eraEdicion = !!editandoNota;
      limpiarForm();
      aviso('success', eraEdicion ? 'Nota actualizada' : 'Nota guardada');
      cargarExpediente();
    }

    async function iniciar() {
      if (!id) { location.href = 'index.html'; return; }
      const res = await api('/auth/yo');
      yo = await res.json();
      $('nombreUsuario').textContent = yo.nombre;

      const campos = await api('/campos-especialidad');
      CAMPOS = await campos.json();

      if (yo.rol === 'paciente') {
        // Vista del paciente: solo lectura
        $('colForm').remove();
        $('colNotas').className = 'col-12 mb-4';
        $('volver').remove();
        $('enlaceInicio').removeAttribute('href');
      } else {
        pintarExtras('');
        cargarMeds([]);
      }
      cargarExpediente();
    }

    $('btnSalir').addEventListener('click', async () => {
      await fetch('/auth/logout', { method: 'POST' });
      location.href = 'login.html';
    });
    $('btnGuardar').addEventListener('click', guardar);
    $('btnCancelar').addEventListener('click', limpiarForm);
    $('btnAgregarMed').addEventListener('click', () => agregarFilaMed());
    $('especialidad').addEventListener('change', () => pintarExtras($('especialidad').value));
    $('notas').addEventListener('click', e => {
      const btn = e.target.closest('button[data-accion]');
      if (!btn) return;
      if (btn.dataset.accion === 'editar') editar(btn.dataset.id);
      if (btn.dataset.accion === 'borrar') borrar(btn.dataset.id);
    });

    iniciar();
  </script>
</body>
</html>
