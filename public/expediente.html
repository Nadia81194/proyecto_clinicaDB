<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clínica - Expediente</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand" href="index.html">← Pacientes</a>
      <span class="navbar-text text-white">Expediente clínico</span>
    </div>
  </nav>

  <div class="container">
    <div id="error"></div>

    <!-- Datos del paciente (Postgres) -->
    <div class="card shadow-sm mb-4">
      <div class="card-header">Datos del paciente <span class="badge bg-secondary">PostgreSQL</span></div>
      <div class="card-body" id="paciente"></div>
    </div>

    <div class="row">
      <!-- Notas (Mongo) -->
      <div class="col-md-8 mb-4">
        <h5>Notas clínicas <span class="badge bg-success">MongoDB</span></h5>
        <div id="notas"></div>
      </div>

      <!-- Nueva nota -->
      <div class="col-md-4 mb-4">
        <div class="card shadow-sm">
          <div class="card-header">Agregar nota</div>
          <div class="card-body">
            <div class="mb-2">
              <label class="form-label">Especialidad</label>
              <input id="especialidad" class="form-control">
            </div>
            <div class="mb-2">
              <label class="form-label">Diagnóstico *</label>
              <input id="diagnostico" class="form-control">
            </div>
            <div class="mb-2">
              <label class="form-label">Síntomas (separados por coma)</label>
              <input id="sintomas" class="form-control">
            </div>
            <div class="mb-2">
              <label class="form-label">Medicamento</label>
              <input id="med_nombre" class="form-control" placeholder="Nombre">
              <div class="d-flex gap-1 mt-1">
                <input id="med_dosis" class="form-control" placeholder="Dosis">
                <input id="med_frecuencia" class="form-control" placeholder="Frecuencia">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Notas</label>
              <textarea id="texto_libre" class="form-control" rows="3"></textarea>
            </div>
            <button class="btn btn-success w-100" onclick="agregarNota()">Guardar nota</button>
            <div id="mensaje" class="mt-2"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const id = new URLSearchParams(location.search).get('id');

    function texto(valor) {
      const d = document.createElement('div');
      d.textContent = valor ?? '';
      return d.innerHTML;
    }

    async function cargarExpediente() {
      const res = await fetch('/expediente/' + id);
      if (!res.ok) {
        document.getElementById('error').innerHTML =
          '<div class="alert alert-danger">No se pudo cargar el expediente</div>';
        return;
      }
      const { paciente, notas } = await res.json();

      document.getElementById('paciente').innerHTML = `
        <div class="row">
          <div class="col-md-3"><strong>Nombre</strong><br>${texto(paciente.nombre)}</div>
          <div class="col-md-3"><strong>Nacimiento</strong><br>${texto((paciente.fecha_nacimiento || '').slice(0, 10))}</div>
          <div class="col-md-3"><strong>Sexo</strong><br>${texto(paciente.sexo)}</div>
          <div class="col-md-3"><strong>Teléfono</strong><br>${texto(paciente.telefono)}</div>
        </div>`;

      const contenedor = document.getElementById('notas');
      if (notas.length === 0) {
        contenedor.innerHTML = '<div class="alert alert-info">Este paciente aún no tiene notas.</div>';
        return;
      }
      contenedor.innerHTML = notas.map(n => {
        const meds = (n.medicamentos || [])
          .map(m => `${texto(m.nombre)} ${texto(m.dosis)} (${texto(m.frecuencia)})`).join('<br>');
        const sintomas = (n.sintomas || []).map(s => `<span class="badge bg-light text-dark border">${texto(s)}</span>`).join(' ');
        return `
          <div class="card shadow-sm mb-3">
            <div class="card-header d-flex justify-content-between">
              <span>${texto(n.especialidad)}</span>
              <small>${texto((n.fecha || '').slice(0, 10))}</small>
            </div>
            <div class="card-body">
              <h6>${texto(n.diagnostico)}</h6>
              <p class="mb-1">${sintomas}</p>
              ${meds ? `<p class="mb-1"><strong>Medicamentos:</strong><br>${meds}</p>` : ''}
              <p class="mb-0 text-muted">${texto(n.texto_libre)}</p>
            </div>
          </div>`;
      }).join('');
    }

    async function agregarNota() {
      const mensaje = document.getElementById('mensaje');
      const diagnostico = document.getElementById('diagnostico').value.trim();
      if (!diagnostico) {
        mensaje.innerHTML = '<div class="alert alert-warning py-1">El diagnóstico es obligatorio</div>';
        return;
      }
      const medNombre = document.getElementById('med_nombre').value.trim();
      const nota = {
        especialidad: document.getElementById('especialidad').value,
        diagnostico,
        sintomas: document.getElementById('sintomas').value
          .split(',').map(s => s.trim()).filter(Boolean),
        medicamentos: medNombre ? [{
          nombre: medNombre,
          dosis: document.getElementById('med_dosis').value,
          frecuencia: document.getElementById('med_frecuencia').value
        }] : [],
        texto_libre: document.getElementById('texto_libre').value
      };
      const res = await fetch(`/pacientes/${id}/notas`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(nota)
      });
      if (res.ok) {
        mensaje.innerHTML = '<div class="alert alert-success py-1">Nota guardada</div>';
        ['especialidad','diagnostico','sintomas','med_nombre','med_dosis','med_frecuencia','texto_libre']
          .forEach(c => document.getElementById(c).value = '');
        cargarExpediente();
      } else {
        mensaje.innerHTML = '<div class="alert alert-danger py-1">Error al guardar la nota</div>';
      }
    }

    cargarExpediente();
  </script>
</body>
</html>
